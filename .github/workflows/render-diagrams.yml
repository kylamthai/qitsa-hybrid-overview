name: Render Mermaid Diagrams
on:
  push:
    branches:
      - pipeline-diagram
    paths:
      - 'docs/*.mmd'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli
      - name: Render diagrams
        run: |
          mmdc -i docs/pipeline-overview.mmd \
            -o docs/pipeline-overview.png --scale 1
          mmdc -i docs/pipeline-overview.mmd \
            -o docs/pipeline-overview@2x.png --scale 2
      - name: Commit rendered images
        run: |
          git config user.name "diagram-bot"
          git config user.email "diagram-bot@users.noreply.github.com"
          git add docs/pipeline-overview.png docs/pipeline-overview@2x.png
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Render pipeline diagram PNGs"
            git push origin pipeline-diagram
